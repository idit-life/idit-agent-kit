[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "idit-agent-kit"
version = "0.1.0"
description = "Drop-in library for AI agents to sign entries to a Personal Idit chain."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Jonathan Tinkler", email = "idit@proton.me"}]
keywords = ["idit", "blockchain", "ai", "agent", "chain", "signing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = ["httpx>=0.25"]

[project.urls]
Homepage = "https://idit.life"
Repository = "https://github.com/idit-life/idit-agent-kit"
